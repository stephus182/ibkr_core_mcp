version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # mcp 2.x is a port, not a bump: 2.0.0 removed the Server.list_tools/call_tool
      # decorators mcp_server.py uses and renamed ToolAnnotations fields (pyproject.toml,
      # [project.optional-dependencies] server). Lift together with that port.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
