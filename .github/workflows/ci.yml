name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly dependency audit. The base dependencies float upward on purpose, so the
    # resolved tree can acquire a known vulnerability without a single commit landing.
    - cron: "0 6 * * 1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,server]"

      - name: Show resolved versions of unpinned-ceiling deps
        # These deps have no upper bound in pyproject.toml on purpose, so pip always
        # takes their latest release. That's convenient but means a new release can
        # silently change behavior mypy relies on (e.g. RestrictedPython 8.4 added a
        # py.typed marker mid-range and broke the build). Printing resolved versions
        # here puts the culprit right next to a failing lint/mypy/test step instead of
        # requiring a separate bisection.
        run: pip show RestrictedPython google-auth google-auth-oauthlib google-api-python-client defusedxml crawl4ai browser_cookie3 2>/dev/null | grep -E "^(Name|Version):"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest, unit only)
        run: pytest -m "not integration" -v

  # Gates 5 and 6 (docs/audits/security-architecture-audit-2026-09-13.md, "Proposed CI
  # design"). Each detects a failure class none of the four steps above can see: a
  # vulnerable *resolved* dependency, and a committed secret. Both block merges.

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: pip-audit
        # Requirements mode: pip-audit resolves `.[dev,server,scraper]` — every extra,
        # because the audit is of what a user installs, and the scraper extra is where
        # findings have surfaced — with `pip install --dry-run --report` in a throwaway
        # venv (pip upgraded there first, so pip itself is still audited) and installs
        # nothing. Verified locally 2026-09-13 against the same tree the install mode saw.
        # --strict: a dependency that cannot be audited is a failure, not a skip.
        # Ignores come only from security/pip-audit-ignores.txt (reason + re-check date
        # per line); a finding with a fixed release is never ignored — bump the floor.
        run: |
          printf '.[dev,server,scraper]\n' > /tmp/audit-requirements.txt
          IGNORES=$(sed 's/#.*//' security/pip-audit-ignores.txt | awk 'NF { printf "--ignore-vuln %s ", $1 }')
          pip-audit --strict --desc --vulnerability-service osv --progress-spinner off $IGNORES -r /tmp/audit-requirements.txt

  # Gate 7 (MCP security checklist 1.3, 2026-11-09): a Software Bill of Materials of what a user
  # installs — `.[server,scraper]` resolved on this runner — as a CycloneDX 1.6 JSON artifact per
  # push and per week, beside pip-audit's verdict on the same tree. The scraper extra is included
  # because it is what the audit covers and where findings have surfaced. It is an artifact, not
  # a gate: a reader of a vulnerability advisory asks "do we ship it?", and this answers.
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install what a user installs
        run: |
          python -m pip install --upgrade pip
          pip install ".[server,scraper]"

      - name: Generate the SBOM
        # `environment`: the resolved tree of this interpreter, the package itself included.
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
          python -c "import json; d=json.load(open('sbom.cdx.json')); print(d['bomFormat'], d['specVersion'], len(d['components']), 'components')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  # Gate 8 (MCP security checklist 2.2, 2026-11-09): the gateway image — eclipse-temurin plus
  # IBKR's Client Portal zip, built from `ibkr_core_mcp/gateway/` exactly as `GatewayManager`
  # builds it — scanned for known vulnerabilities in its OS packages and Java libraries. The
  # Java process in that image holds the live brokerage session on the operator's machine, and
  # nothing else here looks inside it. INFORMATIONAL (`continue-on-error`) until its first run
  # has been seen, as the forward-compat lane was; then `continue-on-error` goes and a CRITICAL
  # finding blocks. Weekly as well as per push, like pip-audit: the image's base acquires
  # advisories without a commit here.
  gateway-image-scan:
    name: Gateway image scan (trivy)
    runs-on: ubuntu-latest
    continue-on-error: true  # informational until the first run is seen (2026-11-09); then blocking
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the gateway image as GatewayManager does
        run: docker build -t ibkr-core-gateway:ci ibkr_core_mcp/gateway

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ibkr-core-gateway:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  secret-scan:
    name: Secret scan (gitleaks)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the action diffs the pushed / PR range, which needs history

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
