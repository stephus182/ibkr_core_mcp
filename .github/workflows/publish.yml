name: Publish to PyPI

on:
  release:
    types: [published]   # once per Release (stable or pre-release), never for drafts
  workflow_dispatch: {}  # manual rehearsal: gates -> build -> TestPyPI only

permissions:
  contents: read

jobs:
  gates:
    # The tag may point at a commit ci.yml never ran on. Same four steps, same order.
    name: Gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,server]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy
      - name: Test (pytest, unit only)
        run: pytest -m "not integration" -q

  build:
    name: Build sdist and wheel
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Tag must equal pyproject version and have a CHANGELOG entry (release runs)
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${TAG#v}" != "$ver" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $ver"; exit 1
          fi
          if ! grep -q "^## \[$ver\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$ver]' entry"; exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check
        run: twine check --strict dist/*
      - name: Store the distribution packages
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    # Optional rehearsal, manual dispatch only: needs a TestPyPI account and its own pending
    # publisher (environment `testpypi`). The real release never depends on it.
    name: Publish to TestPyPI (manual rehearsal only)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ibkr-core-mcp
    permissions:
      id-token: write   # mandatory for Trusted Publishing; only on the two publish jobs
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true   # a re-run of the same version must not fail here

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi            # required reviewer = the owner; deployment tag rule v*
      url: https://pypi.org/p/ibkr-core-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # attestations: on by default with Trusted Publishing (PEP 740); nothing to add
