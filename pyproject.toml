[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkr_core_mcp"
version = "1.2.2"
description = "IBKR Client Portal API client, Drive cache, SQLite store, Claude tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [{name = "Stephane Menard", email = "stephane.menard@gmail.com"}]
keywords = ["ibkr", "interactive-brokers", "trading", "mcp", "claude", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31",
    "urllib3>=2.2.2",
    "pydantic>=2.0",
    "anthropic>=0.28",
    "pandas>=2.2",
    "numpy>=1.26",
    "RestrictedPython>=7.0",  # no ceiling by design — CI prints the resolved version so a breaking release is easy to spot
    "pyarrow>=16.0",
    "google-api-python-client>=2.130",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "python-dotenv>=1.0",
    "defusedxml>=0.7",
    "exchange_calendars>=4.5",
    "browser-cookie3>=0.19",
    "pyobjc-framework-LocalAuthentication; sys_platform == 'darwin'",
    "websockets>=12.0",  # backs IBKRWebSocket/AlertManager, exported from __init__.py — core client API, not server-only
]

[project.optional-dependencies]
server = [
    "mcp>=1.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
]
scraper = ["crawl4ai>=0.5.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.12", "pytest-socket>=0.7", "mypy>=1.8", "ruff>=0.16"]

[project.urls]
Homepage = "https://github.com/stephus182/ibkr_core_mcp"
Repository = "https://github.com/stephus182/ibkr_core_mcp"
Issues = "https://github.com/stephus182/ibkr_core_mcp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ibkr_core_mcp*"]

[tool.setuptools.package-data]
ibkr_core_mcp = [
    "py.typed",
    "gateway/Dockerfile",
    "gateway/conf.yaml",
    "gateway/*.sh",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires live IBKR gateway and credentials",
    "market_data: claude_tools market-data handlers",
    "account: claude_tools account/portfolio handlers",
    "trades: claude_tools trade-history handlers",
    "orders: claude_tools order read/preview handlers",
    "flex: claude_tools Flex Query handlers",
    "alerts: claude_tools price-alert handlers",
    "pa_analytics: claude_tools PA/analytics handlers",
    "backtest_pinescript: claude_tools backtest/pinescript handlers",
    "web_scraping: claude_tools firecrawl/scrape-fallback handlers",
    "errors: claude_tools _safe_error mapping",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["ibkr_core_mcp", "tests"]

# tests/ never annotates function signatures (established convention, 0 annotations
# across 747 tests) — disallow_untyped_defs would demand annotating every test
# function/fixture for zero safety benefit. check_untyped_defs (inherited from
# strict) still type-checks each function's body, so real bugs inside untyped
# tests are still caught — see the 2026-07-22 code-quality audit for the fresh
# inventory (1164 raw findings -> 183 real ones once this override is applied).
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "LocalAuthentication",
    "AppKit",
    "tkinter",
    "tkinter.*",
    "browser_cookie3",
    "browser_cookie3.*",
    "RestrictedPython",
    "RestrictedPython.*",
    "googleapiclient",
    "googleapiclient.*",
    "google.auth",
    "google.auth.*",
    "google.oauth2",
    "google.oauth2.*",
    "defusedxml",
    "defusedxml.*",
    "crawl4ai",
    "crawl4ai.*",
]
ignore_missing_imports = true

# RestrictedPython>=8.4 ships py.typed but its __init__.py re-exports
# compile_restricted/safe_globals without `__all__`, tripping mypy strict's
# implicit-reexport check even though the names are genuinely public API.
[[tool.mypy.overrides]]
module = ["RestrictedPython", "RestrictedPython.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["ibkr_core_mcp.client"]
warn_return_any = false

[[tool.mypy.overrides]]
module = ["ibkr_core_mcp.mcp_server"]
disallow_untyped_decorators = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["ibkr_core_mcp.cache"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["ibkr_core_mcp.gdrive_auth"]
disallow_untyped_calls = false
warn_return_any = false

[tool.ruff]
target-version = "py311"
line-length = 120
# Markdown is documentation, not source. ruff 0.16 began formatting Python code blocks
# embedded in .md files, which rewrites this repo's hand-aligned annotated examples (the
# `client.crawl(...)  # -> list[...]` comment columns in docs/*-reference.md) into
# single-space comments. That is the same class of formatting opinion already declined for
# docstrings in the D-code ignore list below: the content is correct, and enforcing the
# tool's preference would be churn that makes the docs harder to read.
#
# This also closes a local/CI drift: `ruff>=0.3` in the dev extra let CI resolve 0.16 while
# a developer's pinned venv sat on 0.15, so `ruff format --check .` passed locally and
# failed in CI on 36 files nobody had touched.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "D"]
ignore = [
    "E501",   # line too long — string literals, test fixtures, and tool descriptions exceed 120 chars
    "S101",   # assert — used in tests
    "S603",   # subprocess — all calls use list form, never shell=True
    "S105",   # hardcoded-password-string — IBKR JKS defaults in conf.yaml tests
    "S311",   # random — not used for cryptography
    "S501",   # verify=False — intentional, IBKR gateway uses a self-signed localhost cert (documented in SECURITY.md)
    "S607",   # partial executable path — docker/open are standard OS tools; full paths would be OS-specific
    "S110",   # try-except-pass — intentional in optional store saves and tkinter after_cancel guard

    # pydocstyle: "D" is enabled for the D1xx *coverage* rules. Those are the ones worth
    # enforcing — the 2026-07-25 docs pass found 39 undocumented public definitions,
    # including IBKRClient.__init__ (which pins TLS-verify-off to localhost) and the
    # FirecrawlClient constructor, and nothing in CI could see them. This mirrors the
    # configuration adopted in claudia_ui on the same date, so both repos enforce one rule.
    #
    # The codes below are formatting opinions that conflict with this codebase's house
    # style: multi-paragraph docstrings that explain *why*, cite source URLs, and open with
    # a full-sentence summary. Enforcing them would be pure churn across docstrings whose
    # content is already correct.
    "D203",   # incompatible with D211 (ruff warns and drops it anyway)
    "D205",   # blank line required between summary and description
    "D209",   # multi-line closing quotes on their own line
    "D213",   # summary on the second line — the inverse of D212 and of the house style
              # here, which opens on the first line (346 docstrings vs 36); ruff warns if
              # both are selected, so exactly one must be ignored
    "D301",   # backslash in docstring requires a raw string
    "D400",   # summary must end with a period
    "D401",   # summary must be in imperative mood
    "D413",   # blank line required after the last section
    "D415",   # summary must end with punctuation
]

[tool.ruff.lint.per-file-ignores]
# Docstring coverage is enforced on the package, not the suite: test names are the
# documentation there, and this codebase's tests carry no signature annotations by
# established convention (see the mypy tests.* override above for the same rationale).
"tests/*" = ["S101", "S106", "S108", "S603", "S607", "D"]
# One-off audit/evidence scripts, committed verbatim as run (timing decomposition, tool-token
# counts, dependency graph, worked metric examples). They are records of a past analysis, not
# maintained library code, so docstring coverage is not enforced on them. Every other rule is.
"scripts/audit/*" = ["D"]
